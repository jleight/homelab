apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: images
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: homelab-push
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux
        email: flux@leightha.us
      messageTemplate: |-
        Update container images

        {{ range .Changed.Changes -}}
        - {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
    push:
      branch: main
  update:
    strategy: Setters
    path: ./SET-THE-UPDATE-PATH-PER-STACK
