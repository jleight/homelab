apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-proxy
spec:
  dependsOn:
    - name: image
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./lib/flux/apps/web/github-proxy
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: github-proxy-subst
