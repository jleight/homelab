apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apex
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./lib/flux/apps/web/apex
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: apex-subst
