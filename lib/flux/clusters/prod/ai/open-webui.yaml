apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
spec:
  dependsOn:
    - name: searxng
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./lib/flux/apps/ai/open-webui
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: open-webui-subst
