# Split from the charts to make sure that the CRDs are created first and the
# operator's mutating webhook is actually up and running before CRs are
# created.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plugins
spec:
  dependsOn:
    - name: charts
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./lib/flux/apps/kube-system/plugins
