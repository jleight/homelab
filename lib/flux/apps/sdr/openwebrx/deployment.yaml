apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebrx
  labels:
    app.kubernetes.io/name: openwebrx
    app.kubernetes.io/instance: openwebrx
    app.kubernetes.io/component: receiver
    app.kubernetes.io/part-of: sdr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openwebrx
      app.kubernetes.io/instance: openwebrx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openwebrx
        app.kubernetes.io/instance: openwebrx
        app.kubernetes.io/component: receiver
        app.kubernetes.io/part-of: sdr
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      initContainers:
        # Deep-merges the committed settings.yaml (receiver identity, devices
        # and band profiles) over the live settings.json, so those keys win
        # while anything set in the web UI (rendering prefs, reporting,
        # rf_gain) is kept. Devices are the exception: any `sdrs` entry not in
        # settings.yaml is dropped, so removing a dongle there removes it from
        # OpenWebRX too. The schema version is left as-is, or defaulted to 8 on
        # an empty volume. Runs as root to chown the file back to the openwebrx
        # user (103:104) so the app can keep rewriting it.
        - name: merge-settings
          image: docker.io/mikefarah/yq:4.54.3@sha256:7834187596ad56fd5a81436114e0b0b9dd54c91bb43946d1f7145b2be5f9c3d2 # {"$imagepolicy": "sdr:yq"}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - >-
              set -e; f=/var/lib/openwebrx/settings.json; [ -s "$f" ] || echo '{}' > "$f"; yq -i -p json -o json 'load("/managed/settings.yaml") as $s | (. * $s) | .sdrs |= with_entries(select(.key as $k | $s.sdrs | has($k))) | .version = (.version // 8)' "$f"; chown 103:104 "$f"
          volumeMounts:
            - name: data
              mountPath: /var/lib/openwebrx
              subPath: var
            - name: managed-settings
              mountPath: /managed
              readOnly: true
      containers:
        - name: openwebrx
          image: docker.io/slechev/openwebrxplus-softmbe:1.2.130@sha256:b6cadccd02d66e48a526ee7524f972e5247bce50e2447b23a474d14299e99060 # {"$imagepolicy": "sdr:openwebrx"}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/New_York
            # Only read on first boot, to create the admin account on an empty
            # volume.
            - name: OPENWEBRX_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: ${admin_user_secret}
                  key: username
            - name: OPENWEBRX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${admin_user_secret}
                  key: password
          ports:
            - name: http
              containerPort: 8073
          resources:
            limits:
              # Both dongles, bind-mounted by the generic-device-plugin. They
              # hang off the same node, so this also pins the pod there.
              devices.k8s.leightha.us/sdr-shortwave: "1"
              devices.k8s.leightha.us/sdr-trunk: "1"
          volumeMounts:
            # One volume holds both the config and data trees, each under its
            # own subPath.
            - name: data
              mountPath: /etc/openwebrx
              subPath: config
            - name: data
              mountPath: /var/lib/openwebrx
              subPath: var
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebrx-data
        - name: managed-settings
          configMap:
            name: openwebrx-settings
        # Fast scratch space for the decoders, kept off the PVC.
        - name: tmp
          emptyDir: {}
