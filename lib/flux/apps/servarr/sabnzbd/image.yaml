apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sabnzbd
spec:
  image: ghcr.io/linuxserver/sabnzbd
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sabnzbd
spec:
  imageRepositoryRef:
    name: sabnzbd
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: "^5.0.0"
  digestReflectionPolicy: Always
  interval: 1h
