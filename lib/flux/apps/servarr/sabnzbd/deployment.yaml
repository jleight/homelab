apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  labels:
    app.kubernetes.io/name: sabnzbd
    app.kubernetes.io/instance: sabnzbd
    app.kubernetes.io/component: usenet
    app.kubernetes.io/part-of: servarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd
      app.kubernetes.io/instance: sabnzbd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sabnzbd
        app.kubernetes.io/instance: sabnzbd
        app.kubernetes.io/component: usenet
        app.kubernetes.io/part-of: servarr
      annotations:
        checksum/config: ${config_checksum}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 911
      initContainers:
        # sabnzbd.ini is rendered whole by Terraform and copied over the
        # volume's copy on every start.
        - name: sabnzbd-config
          image: ghcr.io/linuxserver/sabnzbd:5.1.3@sha256:a7cfba459929f73b83c98b476a845076dc72524af80b24fcb4200684e6b1b675 # {"$imagepolicy": "servarr:sabnzbd"}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - cp /secret/sabnzbd.ini /config/sabnzbd.ini
          volumeMounts:
            - name: secret
              mountPath: /secret/sabnzbd.ini
              subPath: sabnzbd.ini
              readOnly: true
            - name: data
              mountPath: /config
      containers:
        - name: sabnzbd
          image: ghcr.io/linuxserver/sabnzbd:5.1.3@sha256:a7cfba459929f73b83c98b476a845076dc72524af80b24fcb4200684e6b1b675 # {"$imagepolicy": "servarr:sabnzbd"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /config
            # Logs churn constantly and nothing reads them after a restart.
            - name: temp
              mountPath: /config/logs
              subPath: logs
            - name: incomplete
              mountPath: /downloads/incomplete
            - name: media
              mountPath: /downloads/unsorted
              subPath: unsorted
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sabnzbd-data
        - name: incomplete
          persistentVolumeClaim:
            claimName: sabnzbd-incomplete
        - name: media
          persistentVolumeClaim:
            claimName: sabnzbd-media
        - name: secret
          secret:
            secretName: ${config_secret}
        - name: temp
          emptyDir: {}
