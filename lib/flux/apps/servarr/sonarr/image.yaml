apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sonarr
spec:
  image: ghcr.io/linuxserver/sonarr
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sonarr
spec:
  imageRepositoryRef:
    name: sonarr
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: "^4.0.0"
  digestReflectionPolicy: Always
  interval: 1h
