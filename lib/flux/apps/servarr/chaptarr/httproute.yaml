apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chaptarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/name: Chaptarr
    gethomepage.dev/description: Books
    gethomepage.dev/icon: readarr.png
spec:
  parentRefs: ${gateway_parent_refs}
  hostnames:
    - ${domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: ${path}
      backendRefs:
        - name: chaptarr
          port: 80
