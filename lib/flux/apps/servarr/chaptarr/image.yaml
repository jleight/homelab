apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: chaptarr
spec:
  image: docker.io/chaptarr/chaptarr
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: chaptarr
spec:
  imageRepositoryRef:
    name: chaptarr
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: "^0"
  digestReflectionPolicy: Always
  interval: 1h
