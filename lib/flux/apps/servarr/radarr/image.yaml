apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: radarr
spec:
  image: ghcr.io/linuxserver/radarr
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: radarr
spec:
  imageRepositoryRef:
    name: radarr
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: "^6.0.0"
  digestReflectionPolicy: Always
  interval: 1h
