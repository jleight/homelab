apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: romm
spec:
  image: docker.io/rommapp/romm
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: romm
spec:
  imageRepositoryRef:
    name: romm
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: "^5.0.0"
  digestReflectionPolicy: Always
  interval: 1h
