apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-retroarch-bridge-data
  annotations:
    # Never let a bad commit prune it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${data_storage_class}
  resources:
    requests:
      storage: 1Gi
