# Only the libtorrent v1 builds.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: qbittorrent
spec:
  image: ghcr.io/linuxserver/qbittorrent
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: qbittorrent
spec:
  imageRepositoryRef:
    name: qbittorrent
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)-libtorrentv1$'
    extract: '$version'
  policy:
    semver:
      range: "^5.0.0"
  digestReflectionPolicy: Always
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: flood
spec:
  image: docker.io/jesec/flood
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: flood
spec:
  imageRepositoryRef:
    name: flood
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: "^4.0.0"
  digestReflectionPolicy: Always
  interval: 1h
