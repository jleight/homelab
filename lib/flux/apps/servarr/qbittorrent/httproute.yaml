apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/name: qBittorrent
    gethomepage.dev/description: Torrents
    gethomepage.dev/icon: qbittorrent.png
spec:
  parentRefs: ${gateway_parent_refs}
  hostnames:
    - ${domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: ${path}/
      backendRefs:
        - name: qbittorrent
          port: 80
    # Flood only works under its base URI with the trailing slash.
    - matches:
        - path:
            type: Exact
            value: ${path}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: ${path}/
            statusCode: 302
