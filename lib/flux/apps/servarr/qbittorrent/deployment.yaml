apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/component: torrent
    app.kubernetes.io/part-of: servarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
      app.kubernetes.io/instance: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/instance: qbittorrent
        app.kubernetes.io/component: torrent
        app.kubernetes.io/part-of: servarr
      annotations:
        checksum/config: ${config_checksum}
    spec:
      enableServiceLinks: false
      containers:
        - name: qbittorrent
          image: ghcr.io/linuxserver/qbittorrent:5.3.0-libtorrentv1@sha256:c356d791d6eed9133c21c730fa1b4c542a9f019b77c3899bb6562b5be1120794 # {"$imagepolicy": "servarr:qbittorrent"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: qbittorrent
              containerPort: 8080
          volumeMounts:
            # Rendered by Terraform, including the WebUI login, and mounted
            # read-only over the copy qBittorrent would otherwise rewrite.
            - name: config
              mountPath: /config/qBittorrent/qBittorrent.conf
              subPath: qBittorrent.conf
              readOnly: true
            - name: data
              mountPath: /config/qBittorrent
            - name: media
              mountPath: /media
        # The web UI. It reaches qBittorrent over localhost.
        - name: flood
          image: docker.io/jesec/flood:4.16.3@sha256:241f172786fe958a09a55615cb4cd1b15d0aec9751f2d87dd8d7a67bcd24f0fa # {"$imagepolicy": "servarr:flood"}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: qbittorrent-flood-env
            - secretRef:
                name: qbittorrent-flood
          ports:
            - name: http
              containerPort: 3000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qbittorrent-data
        - name: media
          persistentVolumeClaim:
            claimName: qbittorrent-media
        - name: config
          configMap:
            name: qbittorrent-config
