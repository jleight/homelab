apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/component: torrent
    app.kubernetes.io/part-of: servarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
      app.kubernetes.io/instance: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/instance: qbittorrent
        app.kubernetes.io/component: torrent
        app.kubernetes.io/part-of: servarr
      annotations:
        checksum/config: ${config_checksum}
    spec:
      enableServiceLinks: false
      containers:
        - name: qbittorrent
          image: ghcr.io/linuxserver/qbittorrent:5.3.0-libtorrentv1@sha256:b96be7070c589b60e323dadc8e049610e3bdab822038a13a20e4b38cfe9706bb # {"$imagepolicy": "servarr:qbittorrent"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: qbittorrent
              containerPort: 8080
          volumeMounts:
            # Rendered by Terraform, including the WebUI login, and mounted
            # read-only over the copy qBittorrent would otherwise rewrite.
            - name: config
              mountPath: /config/qBittorrent/qBittorrent.conf
              subPath: qBittorrent.conf
              readOnly: true
            - name: data
              mountPath: /config/qBittorrent
            - name: media
              mountPath: /media
        # The web UI. It reaches qBittorrent over localhost.
        - name: flood
          image: docker.io/jesec/flood:4.16.4@sha256:72bdc95ff160e1f6b8ad72c171eff53f0bab8aa651389ca710ffff170278390a # {"$imagepolicy": "servarr:flood"}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: qbittorrent-flood-env
            - secretRef:
                name: qbittorrent-flood
          ports:
            - name: http
              containerPort: 3000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qbittorrent-data
        - name: media
          persistentVolumeClaim:
            claimName: qbittorrent-media
        - name: config
          configMap:
            name: qbittorrent-config
