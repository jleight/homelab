apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orca-tasks
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Household
    gethomepage.dev/name: orca-tasks
    gethomepage.dev/description: Tasks
    gethomepage.dev/icon: mdi-checkbox-marked-outline
spec:
  parentRefs: ${gateway_parent_refs}
  hostnames:
    - ${domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: orca-tasks
          port: 80
