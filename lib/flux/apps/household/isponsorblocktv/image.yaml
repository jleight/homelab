apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: isponsorblocktv
spec:
  image: ghcr.io/dmunozv04/isponsorblocktv
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: isponsorblocktv
spec:
  imageRepositoryRef:
    name: isponsorblocktv
  filterTags:
    pattern: '^v(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=2.0.0 <3.0.0"
  digestReflectionPolicy: Always
  interval: 1h
---
# Used only as a notification trigger for major version updates.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: isponsorblocktv-latest
spec:
  imageRepositoryRef:
    name: isponsorblocktv
  filterTags:
    pattern: '^v(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=2.0.0"
