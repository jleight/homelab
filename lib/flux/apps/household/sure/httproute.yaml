apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sure
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Household
    gethomepage.dev/name: Sure
    gethomepage.dev/description: Finances
    gethomepage.dev/icon: sure.png
spec:
  parentRefs: ${gateway_parent_refs}
  hostnames:
    - ${domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sure
          port: 80
