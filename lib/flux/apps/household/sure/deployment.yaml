apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure
  labels:
    app.kubernetes.io/name: sure
    app.kubernetes.io/instance: sure
    app.kubernetes.io/component: finance
    app.kubernetes.io/part-of: household
spec:
  replicas: 1
  # The storage volume is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sure
      app.kubernetes.io/instance: sure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure
        app.kubernetes.io/instance: sure
        app.kubernetes.io/component: finance
        app.kubernetes.io/part-of: household
      annotations:
        checksum/secret: ${secret_checksum}
        checksum/env: ${env_checksum}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # The entrypoint only migrates before `rails server`, so without this
        # the worker would start against an unmigrated database on an
        # upgrade. The web container's own db:prepare is then a no-op.
        - name: migrate
          image: ghcr.io/we-promise/sure:0.7.6@sha256:61cd4c1fa9917200f8db4434b45d968235f375c52cdbdc81bf4a4df555a2f090 # {"$imagepolicy": "household:sure"}
          imagePullPolicy: IfNotPresent
          args:
            - ./bin/rails
            - db:prepare
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: sure-env
            - secretRef:
                name: ${secret_name}
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      containers:
        - name: web
          image: ghcr.io/we-promise/sure:0.7.6@sha256:61cd4c1fa9917200f8db4434b45d968235f375c52cdbdc81bf4a4df555a2f090 # {"$imagepolicy": "household:sure"}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: sure-env
            - secretRef:
                name: ${secret_name}
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
            - name: initializers
              mountPath: /rails/config/initializers/zz_simplefin_money_market.rb
              subPath: simplefin_money_market.rb
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 30
        - name: worker
          image: ghcr.io/we-promise/sure:0.7.6@sha256:61cd4c1fa9917200f8db4434b45d968235f375c52cdbdc81bf4a4df555a2f090 # {"$imagepolicy": "household:sure"}
          imagePullPolicy: IfNotPresent
          args:
            - bundle
            - exec
            - sidekiq
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: sure-env
            - secretRef:
                name: ${secret_name}
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
            - name: initializers
              mountPath: /rails/config/initializers/zz_simplefin_money_market.rb
              subPath: simplefin_money_market.rb
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: sure-storage
        # Overrides for Sure's own initializers; see simplefin_money_market.rb.
        - name: initializers
          configMap:
            name: sure-initializers
