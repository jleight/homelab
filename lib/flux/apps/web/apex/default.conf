# Only /.well-known/ is routed here; the gateway redirects everything else.
# Avoid nginx $variables: Flux substitutes this file too.
server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Matrix discovery documents are JSON with no extension, and Element web
    # fetches them cross-origin.
    location /.well-known/matrix/ {
        root /srv/www;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        return 404;
    }
}
