apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverse-proxy-public
  labels:
    app.kubernetes.io/name: reverse-proxy-public
    app.kubernetes.io/instance: reverse-proxy-public
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: reverse-proxy-public
      app.kubernetes.io/instance: reverse-proxy-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reverse-proxy-public
        app.kubernetes.io/instance: reverse-proxy-public
        app.kubernetes.io/component: proxy
        app.kubernetes.io/part-of: web
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00 # {"$imagepolicy": "web:nginx"}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: amp
              containerPort: 8081
            - name: sdr
              containerPort: 8082
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: reverse-proxy-public-nginx
        - name: tmp
          emptyDir: {}
