# Each backend gets its own listener port, and the HTTPRoute picks it by
# Service port. nginx never dispatches on the Host header, so the gateway's
# hostname match is the only routing decision, and a forged Host cannot reach
# a backend the route did not select.
#
# Flux substitution is disabled on the ConfigMap so nginx $variables survive.
resolver kube-dns.kube-system.svc.cluster.local valid=30s;

proxy_http_version 1.1;
client_max_body_size 0;

proxy_set_header Host            $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade         $http_upgrade;
proxy_set_header Connection      "upgrade";

server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 404;
    }
}

# AMP game server panel, games.<domain>.
server {
    listen 8081;

    location / {
        # A variable in proxy_pass makes nginx re-resolve via the resolver
        # above instead of pinning the startup IP.
        set $backend http://fwd01.leightha.us:8080;
        proxy_pass $backend;
    }
}

# Web-888 SDR receiver, sdr.<domain>.
server {
    listen 8082;

    location / {
        # A variable in proxy_pass makes nginx re-resolve via the resolver
        # above instead of pinning the startup IP.
        set $backend http://web888.leightha.us:8073;
        proxy_pass $backend;
    }
}

# tar1090 aircraft map, adsb.<domain>. Only the map's own port is proxied, and
# it is read-only, so anything but GET is refused.
server {
    listen 8083;

    location / {
        limit_except GET {
            deny all;
        }

        # A variable in proxy_pass makes nginx re-resolve via the resolver
        # above instead of pinning the startup IP.
        set $backend http://readsb.leightha.us:8080;
        proxy_pass $backend;
    }
}
