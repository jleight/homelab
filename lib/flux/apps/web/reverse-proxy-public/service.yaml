apiVersion: v1
kind: Service
metadata:
  name: reverse-proxy-public
  labels:
    app.kubernetes.io/name: reverse-proxy-public
    app.kubernetes.io/instance: reverse-proxy-public
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: web
spec:
  ports:
    - name: amp
      port: 8081
      targetPort: amp
    - name: sdr
      port: 8082
      targetPort: sdr
  selector:
    app.kubernetes.io/name: reverse-proxy-public
    app.kubernetes.io/instance: reverse-proxy-public
