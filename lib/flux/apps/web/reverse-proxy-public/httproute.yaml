apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: amp
spec:
  parentRefs: ${public_gateway_parent_refs}
  hostnames:
    - games.${gateway_domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: reverse-proxy-public
          port: 8081
---
