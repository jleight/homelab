apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverse-proxy-private
  labels:
    app.kubernetes.io/name: reverse-proxy-private
    app.kubernetes.io/instance: reverse-proxy-private
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: reverse-proxy-private
      app.kubernetes.io/instance: reverse-proxy-private
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reverse-proxy-private
        app.kubernetes.io/instance: reverse-proxy-private
        app.kubernetes.io/component: proxy
        app.kubernetes.io/part-of: web
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e # {"$imagepolicy": "web:nginx"}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: odysseus
              containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: reverse-proxy-private-nginx
        - name: tmp
          emptyDir: {}
