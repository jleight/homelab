apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: odysseus
spec:
  parentRefs: ${private_gateway_parent_refs}
  hostnames:
    - odysseus.${gateway_domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: reverse-proxy-private
          port: 8081
