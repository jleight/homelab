apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
configMapGenerator:
  - name: github-proxy-nginx
    files:
      - default.conf.template
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
