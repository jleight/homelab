apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: homepage
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
      app.kubernetes.io/instance: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/instance: homepage
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/part-of: web
    spec:
      serviceAccountName: homepage
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61 # {"$imagepolicy": "web:homepage"}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # Kubernetes sets HOSTNAME to the pod name, which the entrypoint
            # would otherwise bind to.
            - name: HOSTNAME
              value: "::"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The pod IP entry is what lets the kubelet's probes through.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: ${domain},$(POD_IP):3000
          ports:
            - name: http
              containerPort: 3000
          # The image prerenders the page with default settings at build time,
          # and Homepage only revalidates when a browser holding an older
          # config hash comes back. Force it once the server is up so the
          # mounted settings.yaml applies from the first load. No shell
          # variables here: Flux would substitute them.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    timeout 60 sh -c 'until wget -q -O /dev/null
                    --header "Host: ${domain}"
                    http://127.0.0.1:3000/api/revalidate; do sleep 1; done'
                    || true
          # The config directory is an emptyDir so Homepage can write its logs
          # and copy in defaults for any file not mounted here.
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: config-files
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
              readOnly: true
            - name: config-files
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
              readOnly: true
            - name: config-files
              mountPath: /app/config/services.yaml
              subPath: services.yaml
              readOnly: true
            - name: config-files
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
              readOnly: true
            - name: config-files
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          emptyDir: {}
        - name: config-files
          configMap:
            name: homepage-config
