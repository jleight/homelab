apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/component: automation
    app.kubernetes.io/part-of: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
      app.kubernetes.io/instance: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
        app.kubernetes.io/instance: home-assistant
        app.kubernetes.io/component: automation
        app.kubernetes.io/part-of: home
      annotations:
        checksum/secret: ${secret_checksum}
    spec:
      enableServiceLinks: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # Deep-merges the overlay into configuration.yaml before HA starts, so
        # the recorder always points at Postgres regardless of what config is
        # present (fresh, or restored from a HAOS backup that defaults to
        # SQLite). yq preserves the rest of the file, including comments and
        # HA's !secret/!include tags. Runs as root because /config is
        # root-owned and the yq image defaults to uid 1000.
        - name: merge-config
          image: docker.io/mikefarah/yq:4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e # {"$imagepolicy": "home:yq"}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - f=/config/configuration.yaml; [ -f "$f" ] || printf 'default_config:\n' > "$f"; yq -i '. *= load("/managed/overlay.yaml")' "$f"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-overlay
              mountPath: /managed
              readOnly: true
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.0@sha256:1b64d38f38d922bf9d59336451fd6453e1d614f934456af4ee3d2a51061be3a4 # {"$imagepolicy": "home:home-assistant"}
          imagePullPolicy: IfNotPresent
          # HASS_MQTT_HOST/HASS_MQTT_PORT and HASS_RECORDER_DB_URL, referenced
          # from configuration.yaml with !env_var.
          envFrom:
            - configMapRef:
                name: home-assistant-env
            - secretRef:
                name: home-assistant
          ports:
            - name: http
              containerPort: 8123
          volumeMounts:
            - name: config
              mountPath: /config
            # The SMB share on nas02, where HA writes its backups.
            - name: backups
              mountPath: /config/backups
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: backups
          persistentVolumeClaim:
            claimName: home-assistant-backups
        - name: config-overlay
          configMap:
            name: home-assistant-config-overlay
