apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: zigbee2mqtt
spec:
  image: ghcr.io/koenkk/zigbee2mqtt
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: zigbee2mqtt
spec:
  imageRepositoryRef:
    name: zigbee2mqtt
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: "^2.0.0"
  digestReflectionPolicy: Always
  interval: 1h
