apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  labels:
    app.kubernetes.io/name: zigbee2mqtt
    app.kubernetes.io/instance: zigbee2mqtt
    app.kubernetes.io/component: zigbee
    app.kubernetes.io/part-of: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zigbee2mqtt
      app.kubernetes.io/instance: zigbee2mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zigbee2mqtt
        app.kubernetes.io/instance: zigbee2mqtt
        app.kubernetes.io/component: zigbee
        app.kubernetes.io/part-of: home
      annotations:
        checksum/config: ${config_checksum}
    spec:
      enableServiceLinks: false
      initContainers:
        # Deep-merges the Terraform-managed config into the persisted
        # configuration.yaml, so those keys win while Z2M's runtime state
        # (network_key, pan_id, devices) is preserved. Runs as root because the
        # data volume is root-owned and the yq image defaults to uid 1000.
        - name: merge-config
          image: docker.io/mikefarah/yq:4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e # {"$imagepolicy": "home:yq"}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - f=/app/data/configuration.yaml; [ -f "$f" ] || echo '{}' > "$f"; yq -i '. *= load("/managed/configuration.yaml")' "$f"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: managed-config
              mountPath: /managed
              readOnly: true
      containers:
        - name: zigbee2mqtt
          image: ghcr.io/koenkk/zigbee2mqtt:2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311 # {"$imagepolicy": "home:zigbee2mqtt"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              # The coordinator, bind-mounted at /dev/zigbee by the
              # generic-device-plugin.
              devices.k8s.leightha.us/zigbee: "1"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
        - name: managed-config
          configMap:
            name: zigbee2mqtt-config
