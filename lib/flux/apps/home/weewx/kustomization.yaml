apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home
resources:
  - source.yaml
  - build.yaml
  - image.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
configMapGenerator:
  # The name gets a content hash, so editing either file rolls the pod.
  - name: weewx-site
    files:
      - site/configure.py
      - site/ambient.py
