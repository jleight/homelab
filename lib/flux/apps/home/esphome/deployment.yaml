apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  labels:
    app.kubernetes.io/name: esphome
    app.kubernetes.io/instance: esphome
    app.kubernetes.io/component: firmware
    app.kubernetes.io/part-of: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: esphome
      app.kubernetes.io/instance: esphome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: esphome
        app.kubernetes.io/instance: esphome
        app.kubernetes.io/component: firmware
        app.kubernetes.io/part-of: home
    spec:
      enableServiceLinks: false
      # Host networking for mDNS discovery of the devices. ClusterFirstWithHostNet
      # keeps cluster DNS working from the host network namespace.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: esphome
          image: ghcr.io/esphome/esphome:2026.10.2@sha256:4a918585150e95e7675be84a347384ff308fde1bd32d0e4472666e1252cc0e8f # {"$imagepolicy": "home:esphome"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6052
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: build
              mountPath: /config/.esphome
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: esphome-config
        # The build cache (platformio/compiled artifacts) and the compiled
        # firmware ESPHome writes into /config/.esphome are both regenerable, so
        # they live on emptyDirs rather than filling the small config volume.
        - name: cache
          emptyDir: {}
        - name: build
          emptyDir: {}
