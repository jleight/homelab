apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: esphome
spec:
  image: ghcr.io/esphome/esphome
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: esphome
spec:
  imageRepositoryRef:
    name: esphome
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=2026.0.0"
  digestReflectionPolicy: Always
  interval: 1h
