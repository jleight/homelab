apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: matter-server
spec:
  image: ghcr.io/matter-js/python-matter-server
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: matter-server
spec:
  imageRepositoryRef:
    name: matter-server
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: "^8.0.0"
  digestReflectionPolicy: Always
  interval: 1h
