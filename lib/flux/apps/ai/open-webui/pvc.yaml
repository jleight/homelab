apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${data_storage_class}
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-uploads
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ${uploads_storage_class}
  resources:
    requests:
      storage: 50Gi
