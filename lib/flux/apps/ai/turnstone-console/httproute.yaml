apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: turnstone-console
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/name: Turnstone
    gethomepage.dev/description: Harness
    gethomepage.dev/icon: mdi-robot-outline
spec:
  parentRefs: ${gateway_parent_refs}
  hostnames:
    - ${domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: turnstone-console
          port: 8090
