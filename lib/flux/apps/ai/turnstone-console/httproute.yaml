apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: turnstone-console
spec:
  parentRefs: ${gateway_parent_refs}
  hostnames:
    - ${domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: turnstone-console
          port: 8090
