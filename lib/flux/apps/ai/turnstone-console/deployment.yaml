apiVersion: apps/v1
kind: Deployment
metadata:
  name: turnstone-console
  labels:
    app.kubernetes.io/name: turnstone-console
    app.kubernetes.io/instance: turnstone-console
    app.kubernetes.io/component: console
    app.kubernetes.io/part-of: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: turnstone-console
      app.kubernetes.io/instance: turnstone-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: turnstone-console
        app.kubernetes.io/instance: turnstone-console
        app.kubernetes.io/component: console
        app.kubernetes.io/part-of: ai
      annotations:
        checksum/auth: ${auth_checksum}
    spec:
      enableServiceLinks: false
      containers:
        - name: turnstone-console
          image: ghcr.io/turnstonelabs/turnstone:1.9.3@sha256:5d70c470b5474e9f854296fda47545aff931bf446b750462c31e47174c83897a # {"$imagepolicy": "ai:turnstone"}
          imagePullPolicy: IfNotPresent
          args:
            - turnstone-console
            - --host=0.0.0.0
            - --port=8090
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: turnstone-env
            - secretRef:
                name: ${auth_secret}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
