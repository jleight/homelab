apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: searxng
spec:
  image: docker.io/searxng/searxng
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: searxng
spec:
  imageRepositoryRef:
    name: searxng
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)-[0-9a-f]+$'
    extract: '$version'
  policy:
    semver:
      range: ">=2026.0.0"
  digestReflectionPolicy: Always
  interval: 1h
