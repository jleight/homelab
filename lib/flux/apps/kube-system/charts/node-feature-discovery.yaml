apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  releaseName: node-feature-discovery
  interval: 30m
  chart:
    spec:
      chart: node-feature-discovery
      version: ">=0.19.0 <1.0.0"
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
