apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse
spec:
  parentRefs: ${gateway_parent_refs}
  hostnames:
    - ${domain}
  rules:
    # Client-server API only; /_synapse/admin stays cluster-internal
    # (port-forward to use it).
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /_synapse/client
      backendRefs:
        - name: synapse
          port: 8008
      # Envoy's 15s default would cut off /sync long-polls (30s) and slow
      # media uploads.
      timeouts:
        request: 300s
