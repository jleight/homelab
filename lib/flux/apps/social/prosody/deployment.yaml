apiVersion: apps/v1
kind: Deployment
metadata:
  name: prosody
  labels:
    app.kubernetes.io/name: prosody
    app.kubernetes.io/instance: prosody
    app.kubernetes.io/component: xmpp
    app.kubernetes.io/part-of: social
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prosody
      app.kubernetes.io/instance: prosody
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prosody
        app.kubernetes.io/instance: prosody
        app.kubernetes.io/component: xmpp
        app.kubernetes.io/part-of: social
    spec:
      enableServiceLinks: false
      initContainers:
        - name: chown-data
          image: docker.io/prosodyim/prosody:13.0 # {"$imagepolicy": "social:prosody"}
          command: ["chown", "-R", "prosody:prosody", "/var/lib/prosody"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          volumeMounts:
            - name: data
              mountPath: /var/lib/prosody
      containers:
        - name: prosody
          image: docker.io/prosodyim/prosody:13.0 # {"$imagepolicy": "social:prosody"}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - DAC_OVERRIDE
          ports:
            - name: c2s
              containerPort: 5222
            - name: s2s
              containerPort: 5269
            - name: http
              containerPort: 5280
          env:
            - name: PROSODY_VIRTUAL_HOSTS
              value: ${domain}
            - name: PROSODY_NETWORK_HOSTNAME
              value: ${domain}
            - name: PROSODY_COMPONENTS
              value: conference.${domain}:muc
            - name: PROSODY_MUC_MODULES
              value: muc_mam
            - name: PROSODY_ADMINS
              value: ${admin_jid}
            - name: PROSODY_STORAGE
              value: internal
            - name: PROSODY_ARCHIVE_EXPIRY_DAYS
              value: "30"
            - name: PROSODY_S2S_SECURE_AUTH
              value: "0"
            - name: PROSODY_LOGLEVEL
              value: info
            - name: DOMAIN
              value: ${domain}
            - name: LOCAL
              valueFrom:
                secretKeyRef:
                  name: prosody-admin
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prosody-admin
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/prosody
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: c2s
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: c2s
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prosody-data
