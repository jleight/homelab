apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: prosody
spec:
  image: docker.io/prosodyim/prosody
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: prosody
spec:
  imageRepositoryRef:
    name: prosody
  filterTags:
    pattern: '^(?P<major>\d+)\.(?P<minor>\d+)$'
    extract: '$major.$minor.0'
  policy:
    semver:
      range: "^13.0.0"
  digestReflectionPolicy: Always
  interval: 1h
