apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: prosody
spec:
  image: docker.io/prosodyim/prosody
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: prosody
spec:
  imageRepositoryRef:
    name: prosody
  filterTags:
    pattern: '^(?P<major>\d+)\.(?P<minor>\d+)$'
    extract: '${major}.${minor}.0'
  policy:
    semver:
      range: ">=13.0.0 <14.0.0"
  digestReflectionPolicy: Always
  interval: 1h
---
# Used only as a notification trigger for major version updates.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: prosody-latest
spec:
  imageRepositoryRef:
    name: prosody
  filterTags:
    pattern: '^(?P<major>\d+)\.(?P<minor>\d+)$'
    extract: '${major}.${minor}.0'
  policy:
    semver:
      range: ">=13.0.0"
  interval: 1h
