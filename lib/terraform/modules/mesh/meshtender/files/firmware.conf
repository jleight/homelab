# Serves the observer firmware tree published to the SMB share. Manifests are
# rewritten in place on every release, so they must never be cached; .bin
# images are written once under a versioned name and never change.
server {
    listen 8080;
    server_name _;

    root /srv/firmware;

    # The share is CIFS, where sendfile can hand out stale pages after a
    # manifest is rewritten. Traffic is tiny, so skip it.
    sendfile off;

    # No directory listings; clients fetch the manifest by name.
    autoindex off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # add_header in a location replaces any inherited ones, so each location
    # carries its own CORS header (browser flashers fetch cross-origin).
    location ~* \.json$ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        expires off;
        etag off;
        if_modified_since off;
    }

    location ~* \.bin$ {
        default_type application/octet-stream;
        types { }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        return 404;
    }
}
